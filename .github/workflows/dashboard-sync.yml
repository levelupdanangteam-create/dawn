name: Dashboard sync

# Đồng bộ nền cho internal dashboard (thư mục dashboard/).
# Webhook Shopify lo phần realtime; workflow này là lưới an toàn + kéo Meta Ads
# + tra trạng thái PPL. Chạy trên GitHub Actions nên không tốn thêm chi phí.
#
# Cần khai báo 2 secret trong repo (Settings → Secrets and variables → Actions):
#   DASHBOARD_URL   ví dụ https://phomifood-dashboard.vercel.app
#   CRON_SECRET     đúng bằng biến CRON_SECRET của dashboard

on:
  schedule:
    # Mỗi 30 phút: kéo lại đơn Shopify + tra vận đơn PPL + fulfil bù
    - cron: '*/30 * * * *'
    # 05:10 UTC hằng ngày: kéo Meta Ads + snapshot tồn kho
    - cron: '10 5 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Chạy đồng bộ đầy đủ (30 ngày + tồn kho + Meta)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kiểm tra cấu hình
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Thiếu secret DASHBOARD_URL hoặc CRON_SECRET"
            exit 1
          fi

      - name: Đồng bộ đơn hàng Shopify
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FULL: ${{ inputs.full }}
          DAILY: ${{ github.event.schedule == '10 5 * * *' }}
        run: |
          days=2; inventory=0
          if [ "$FULL" = "true" ]; then days=30; inventory=1; fi
          if [ "$DAILY" = "true" ]; then days=7; inventory=1; fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DASHBOARD_URL/api/sync/shopify?days=$days&inventory=$inventory"
          echo

      - name: Tra vận đơn PPL + fulfil bù
        if: always()
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DASHBOARD_URL/api/sync/ppl"
          echo

      - name: Kéo chi phí Meta Ads
        if: github.event.schedule == '10 5 * * *' || inputs.full
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$DASHBOARD_URL/api/sync/meta?days=7"
          echo
